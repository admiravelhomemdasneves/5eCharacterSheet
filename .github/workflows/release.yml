# Builds the plugin when a version tag (e.g. 1.0.0) is pushed and attaches the files
# Obsidian installs (main.js, manifest.json, styles.css) to a draft GitHub release, whose notes
# are that version's section of CHANGELOG.md.
# The files get a signed build provenance attestation, so anyone can verify they were
# built from this repository: gh attestation verify main.js --repo <owner>/<repo>
name: Release
on:
  push:
    tags: ["*"]
permissions:
  contents: write     # create the release
  id-token: write     # sign the attestation
  attestations: write # store the attestation
  artifact-metadata: write # link the attestation to the release files
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the release's notes: this version's section of CHANGELOG.md ("## <version>" up to the next "## ")
          awk -v v="## $GITHUB_REF_NAME" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "::warning::CHANGELOG.md has no section for $GITHUB_REF_NAME; the release has no notes"
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes-file notes.md dist/main.js dist/manifest.json dist/styles.css
