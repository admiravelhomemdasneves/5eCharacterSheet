# Builds the plugin when a version tag (e.g. 1.0.0) is pushed and attaches the files
# Obsidian installs (main.js, manifest.json, styles.css) to a draft GitHub release.
name: Release
on:
  push:
    tags: ["*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" dist/main.js dist/manifest.json dist/styles.css
